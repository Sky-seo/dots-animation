<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <meta name="description" content="A p5.js recreation of outward-moving dots that shrink and disappear, continuously born at the inner edge.">
  <title>Dots — a motion study</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23090909'/%3E%3Cg fill='%23efefea'%3E%3Ccircle cx='16' cy='7' r='3'/%3E%3Ccircle cx='25' cy='16' r='3'/%3E%3Ccircle cx='16' cy='25' r='3'/%3E%3Ccircle cx='7' cy='16' r='3'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="dots-animation.css">
  <script src="vendor/p5.min.js" defer></script>
  <script src="dots-animation.js" defer></script>
</head>
<body>
  <header>
    <a class="wordmark" href="dots-animation.html" aria-label="Dots home">dots<span>®</span></a>
    <span class="header-note">A study in perpetual motion</span>
    <button id="fullscreen" class="text-button" aria-label="Enter fullscreen">Fullscreen <span aria-hidden="true">⛶</span></button>
  </header>
  <main>
    <section class="stage" aria-label="Interactive dots animation">
      <div class="stage-top"><span>FIG. <span id="figure">01</span></span><span id="mode-label">OUTWARD FLOW</span></div>
      <canvas id="canvas" aria-label="White dots emerge inside, travel outward, shrink, and disappear without rotation. Choose a movement to change the rhythm or shape."></canvas>
      <div class="stage-bottom"><span>Born inside. Moving outward.</span><span id="dot-count">CONTINUOUS FLOW</span></div>
    </section>
    <aside aria-label="Animation controls">
      <div class="intro"><span class="eyebrow">MOTION STUDY / 001</span><h1>Order.<br>In motion.</h1><p>New dots emerge inside.<br>Drift outward. Shrink. Disappear.</p></div>

      <fieldset class="modes"><legend>Movement</legend>
        <label><input type="radio" name="movement" value="emanate" checked><span>01</span> Emanate <i aria-hidden="true">◌</i></label>
        <label><input type="radio" name="movement" value="wave"><span>02</span> Wave <i aria-hidden="true">≈</i></label>
        <label><input type="radio" name="movement" value="pulse"><span>03</span> Pulse <i aria-hidden="true">◎</i></label>
        <label><input type="radio" name="movement" value="flower"><span>04</span> Flower <i aria-hidden="true">✿</i></label>
        <label><input type="radio" name="movement" value="diamond"><span>05</span> Diamond <i aria-hidden="true">◇</i></label>
      </fieldset>
      <div class="parameters">
        <label for="speed">Flow speed <output id="speed-value" for="speed">1.0×</output></label><input id="speed" type="range" min="0" max="2" step="0.05" value="1">
        <label for="size">Dot size <output id="size-value" for="size">3.5</output></label><input id="size" type="range" min="1" max="7" step="0.1" value="3.5">
        <label for="centerDistance">Center distance <output id="centerDistance-value" for="centerDistance">20%</output></label><input id="centerDistance" type="range" min="0" max="30" step="0.5" value="20" title="Distance from the center to where dots appear, as a percentage of the shorter canvas side">
        <label for="spread">Travel distance <output id="spread-value" for="spread">50%</output></label><input id="spread" type="range" min="0" max="100" step="1" value="50">
      </div>
      <div class="transport"><button id="pause" aria-label="Pause animation"><span id="play-icon" aria-hidden="true">Ⅱ</span><span id="play-label">Pause</span></button><button id="reset" class="text-button">Reset <span aria-hidden="true">↺</span></button></div>
      <button id="save" class="save-button">Save a frame <span aria-hidden="true">⊞</span></button>
    </aside>
  </main>
  <footer><span>CREATIVE CODING EXPLORATIONS</span><span>DOTS / CANVAS / TIME</span><span>Made to keep moving.</span></footer>
  <div id="status" class="sr-only" role="status" aria-live="polite"></div>
</body>
</html>
